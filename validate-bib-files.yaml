name: Validate BibTeX

on:
  push:
    paths: ['**.bib']
  pull_request:
    paths: ['**.bib']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install "bibtexparser>=2.0.0b1,<3.0" nameparser rich unidecode

      - name: Check BibTeX files
        run: |
          python bin-tools/fix-bib.py --check --gha --recursive .
